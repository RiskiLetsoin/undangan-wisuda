<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Link Undangan Personal</title>
<style>
  body{font-family:system-ui,sans-serif; background:#0a0908; color:#f3ecdd; padding:24px; max-width:680px; margin:0 auto;}
  h1{font-size:20px; color:#c9a24b;}
  p{color:#c9c1b2; font-size:14px; line-height:1.6;}
  input, textarea{width:100%; padding:10px; margin-top:10px; background:#141210; color:#f3ecdd; border:1px solid #444; border-radius:4px; font-family:inherit;}
  button{margin-top:14px; padding:10px 20px; background:#c9a24b; color:#0a0908; border:none; border-radius:4px; cursor:pointer; font-weight:bold;}
  table{width:100%; margin-top:20px; border-collapse:collapse; font-size:13px;}
  td, th{padding:8px; border-bottom:1px solid #333; text-align:left; word-break:break-all;}
  .copy{cursor:pointer; color:#c9a24b;}
</style>
</head>
<body>
  <h1>Generator Link Undangan Personal</h1>
  <p>1. Isi alamat website undangan Anda yang sudah di-deploy di Vercel.<br>
     2. Tempel daftar nama tamu, satu nama per baris.<br>
     3. Klik "Buat Link" — link untuk tiap tamu akan muncul di tabel, tinggal disalin dan dikirim.</p>

  <label>Alamat website Vercel Anda</label>
  <input id="baseUrl" placeholder="https://undangan-anda.vercel.app">

  <label>Daftar nama tamu (satu per baris)</label>
  <textarea id="names" rows="8" placeholder="Budi Santoso
Siti Aminah
Keluarga Bapak Ahmad"></textarea>

  <button onclick="generate()">Buat Link</button>

  <table id="result"></table>

<script>
function generate(){
  const base = document.getElementById('baseUrl').value.trim().replace(/\/$/,'');
  const names = document.getElementById('names').value.split('\n').map(n=>n.trim()).filter(Boolean);
  const table = document.getElementById('result');
  table.innerHTML = '<tr><th>Nama</th><th>Link</th></tr>';
  names.forEach(name=>{
    const url = base + '/?to=' + encodeURIComponent(name);
    const row = document.createElement('tr');
    row.innerHTML = `<td>${name}</td><td class="copy" onclick="navigator.clipboard.writeText('${url}'); this.textContent='Tersalin!'; setTimeout(()=>this.textContent='${url}',1200)">${url}</td>`;
    table.appendChild(row);
  });
}
</script>
</body>
</html>
